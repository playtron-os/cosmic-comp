version: "3"

vars:
  NAME:
    sh: grep 'name =' Cargo.toml | head -n 1 | cut -d'"' -f2
  VERSION:
    sh: grep '^version =' Cargo.toml | head -n 1 | cut -d'"' -f2
  HOST_OS:
    sh: uname
  HOST_ARCH:
    sh: uname -m
  TARGET_ARCH:
    sh: "rustc -vV | sed -n 's/host: //p'"
  ARCH:
    sh: echo "{{.TARGET_ARCH}}" | cut -d'-' -f1
  IMAGE_NAME: "{{.NAME}}-builder"
  # rust-toolchain.toml is baked into the image (it selects the cross std), so a
  # channel bump has to invalidate the cached image just like a Dockerfile edit does.
  IMAGE_TAG:
    sh: cat Dockerfile rust-toolchain.toml | sha256sum | cut -d' ' -f1
  # Directory name of this checkout. The remote copy keeps the same name so a
  # relative `[patch]` path (`../iced/...`) still resolves there.
  PROJECT:
    sh: basename "$PWD"
  PREFIX: '{{.PREFIX | default "/usr"}}'
  DESTDIR: '{{.DESTDIR | default ""}}'
  # Everything the device does not need, and must not have deleted out from
  # under it: `target` is the remote build cache, `.cache` is the container
  # build's cargo home, `vendor` only exists after `make vendor`.
  RSYNC_EXCLUDES: >-
    --exclude=.git --exclude=target --exclude=.cache --exclude=dist
    --exclude=builder --exclude=node_modules --exclude=vendor
    --exclude=vendor.tar

tasks:
  default:
    aliases:
      - help
    cmds:
      - go-task --list

  build:debug:
    desc: Build debug build
    cmds:
      - cargo build {{.ARG | default ""}} --target {{.TARGET_ARCH}}

  build:release:
    desc: Build release build
    aliases:
      - build
    cmds:
      - cargo build --release --target {{.TARGET_ARCH}}

  build:all:
    desc: Build release and debug builds
    deps:
      - build:debug
      - build:release

  run:
    deps:
      - build:debug
    requires:
      vars:
        - name: LOG_LEVEL
          enum: [trace, debug, info]
    vars:
      LOG_LEVEL: '{{.LOG_LEVEL | default "info"}}'
    env:
      RUST_LOG: |-
        {{- if eq .LOG_LEVEL "trace" }}
        error,agentos_panel=trace,icetron=trace
        {{- else if eq .LOG_LEVEL "debug" }}
        error,agentos_panel=debug,icetron=debug
        {{- else }}
        error,agentos_panel=info
        {{- end }}
    cmds:
      - ./target/{{.TARGET_ARCH}}/debug/{{.NAME}}

  install:
    desc: Install the debug build locally
    deps:
      - build:debug
    cmds:
      - sudo install -D -m 755 ./target/{{.TARGET_ARCH}}/debug/{{.NAME}}
        {{.DESTDIR}}{{.PREFIX}}/bin/{{.NAME}}
      - sudo install -Dm0644 data/keybindings.ron
        {{.DESTDIR}}{{.PREFIX}}/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/defaults
      - sudo install -Dm0644 data/tiling-exceptions.ron
        {{.DESTDIR}}{{.PREFIX}}/share/cosmic/com.system76.CosmicSettings.WindowRules/v1/tiling_exception_defaults
      - >-
        for f in data/voice-mode/*; do
        sudo install -Dm0644 "$f"
        "{{.DESTDIR}}{{.PREFIX}}/share/cosmic/com.playtron.VoiceMode/v1/$(basename "$f")";
        done
      # restorecon, because a file installed from a user checkout inherits
      # user_home_t and the session then cannot exec it under enforcing SELinux.
      # Named files only — a recursive pass over the whole prefix is slow enough
      # to look like a hang.
      - sudo restorecon {{.DESTDIR}}{{.PREFIX}}/bin/{{.NAME}} 2>/dev/null || true
      - echo "Installed {{.NAME}} to {{.DESTDIR}}{{.PREFIX}}/bin"

  deploy:native:
    desc: >-
      Rsync this checkout to a device, build it natively there, and install the
      debug build. E.g. go-task deploy:native HOST=playtron@192.168.1.115
    aliases:
      - deploy:device
    requires:
      vars:
        - name: HOST
    vars:
      # Parent of the remote checkout. Sibling repos synced via WITH land beside
      # it, so relative paths between them survive the trip.
      REMOTE_ROOT: '{{.REMOTE_ROOT | default "~/src"}}'
      REMOTE_DIR: "{{.REMOTE_ROOT}}/{{.PROJECT}}"
      # Space-separated sibling directories to sync alongside, relative to this
      # checkout's parent. Needed when Cargo.toml has an active `[patch]`
      # pointing at one — e.g. WITH=iced, or WITH="iced smithay".
      WITH: '{{.WITH | default ""}}'
    preconditions:
      - sh: which rsync
        msg: "Prerequisite utility 'rsync' is not installed"
      - sh: ssh -o BatchMode=yes -o ConnectTimeout=10 {{.HOST}} true
        msg: "Cannot reach {{.HOST}} over SSH without a password. Set up key auth first."
      - sh: ssh {{.HOST}} 'command -v cargo'
        msg: >-
          No cargo on {{.HOST}}. This target builds natively on the device, so it
          needs a Rust toolchain and the compositor's -devel packages there
          (libinput, libseat, libdisplay-info, wayland, mesa, pixman, udev).
      - sh: ssh {{.HOST}} 'command -v go-task || command -v task'
        msg: "No go-task on {{.HOST}}; it runs the build and install steps there."
      # Cargo fetches private crates over ssh://git@github.com, so the device
      # borrows the local agent (ssh -A below) rather than needing its own key.
      - sh: ssh-add -l
        msg: >-
          No identities in the SSH agent. Run `ssh-add` first — the remote cargo
          fetch authenticates to GitHub through the forwarded agent.
    cmds:
      - echo "Syncing {{.PROJECT}} to {{.HOST}}:{{.REMOTE_DIR}}"
      - ssh {{.HOST}} 'mkdir -p {{.REMOTE_ROOT}}'
      # --delete keeps the remote tree honest about removals; the excludes above
      # are protected from it, so the remote `target` cache survives.
      - rsync -az --delete {{.RSYNC_EXCLUDES}} ./ {{.HOST}}:{{.REMOTE_DIR}}/
      - |
        {{if .WITH}}
        for d in {{.WITH}}; do
          echo "Syncing sibling $d"
          rsync -az --delete {{.RSYNC_EXCLUDES}} "../$d/" "{{.HOST}}:{{.REMOTE_ROOT}}/$d/"
        done
        {{end}}
      - echo "Building and installing on {{.HOST}} (first run compiles from scratch)"
      # -A forwards the agent for the git fetch; CARGO_NET_GIT_FETCH_WITH_CLI
      # makes cargo shell out to git so it actually uses that agent.
      - ssh -A -t {{.HOST}} 'cd {{.REMOTE_DIR}} &&
        CARGO_NET_GIT_FETCH_WITH_CLI=true $(command -v go-task || command -v task) install'
      # Deliberately no restart. This binary IS the session's compositor, so
      # killing it takes down every window, the panel and the greeter with it —
      # unlike the panel, nothing supervises it back up mid-session. The new
      # binary is picked up on the next session start.
      - echo ""
      - echo "Done. {{.NAME}} installed on {{.HOST}}."
      - echo "It is the running compositor, so it was NOT restarted — log out and"
      - echo "back in (or reboot) on the device to pick up the new binary."

  dist:prepare:
    desc: Prepare the project for packaging (set PROFILE=debug for a debuggable build)
    vars:
      PROFILE: '{{.PROFILE | default "release"}}'
      BUILD_FLAGS: '{{if eq .PROFILE "debug"}}--features debug{{else}}--release{{end}}'
    cmds:
      - cargo build {{.BUILD_FLAGS}} --target {{.TARGET_ARCH}}
      - rm -rf .cache/{{.NAME}}
      - mkdir -p .cache/{{.NAME}}/usr/bin
      - install -Dm0755 "target/{{.TARGET_ARCH}}/{{.PROFILE}}/{{.NAME}}" ".cache/{{.NAME}}/usr/bin/{{.NAME}}"
      - install -Dm0644 "data/keybindings.ron" ".cache/{{.NAME}}/usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/defaults"
      - install -Dm0644 "data/tiling-exceptions.ron" ".cache/{{.NAME}}/usr/share/cosmic/com.system76.CosmicSettings.WindowRules/v1/tiling_exception_defaults"
      - install -Dm0644 "LICENSE" ".cache/{{.NAME}}/usr/share/licenses/cosmic-comp/LICENSE"
      # Whatever keys `data/voice-mode` holds, rather than one line each: the
      # list was already stale here once, staging a `chat_app_id` that had been
      # deleted, which fails the packaging build rather than the build that
      # removed it.
      - >-
        for f in data/voice-mode/*; do
        install -Dm0644 "$f"
        ".cache/{{.NAME}}/usr/share/cosmic/com.playtron.VoiceMode/v1/$(basename "$f")";
        done
      - mkdir -p dist

  dist:archive:
    desc: Build a tar archive of the project
    deps:
      - task: dist:prepare
        vars:
          PROFILE: '{{.PROFILE}}'
    vars:
      # Debug and release must not share an artifact name: they stage identical paths, so a
      # shared name lets the up-to-date check package the other profile's tree.
      SUFFIX: '{{if eq .PROFILE "debug"}}-debug{{end}}'
    sources:
      - .cache/{{.NAME}}/**/*
    generates:
      - dist/{{.NAME}}-{{.ARCH}}{{.SUFFIX}}.tar.gz
    cmds:
      - tar cvfz dist/{{.NAME}}-{{.ARCH}}{{.SUFFIX}}.tar.gz -C .cache {{.NAME}}

  dist:rpm:
    desc: Build an RPM package
    aliases:
      - rpm
    deps:
      - task: dist:archive
        vars:
          PROFILE: '{{.PROFILE}}'
    vars:
      SUFFIX: '{{if eq .PROFILE "debug"}}-debug{{end}}'
    sources:
      - dist/{{.NAME}}-{{.ARCH}}{{.SUFFIX}}.tar.gz
      - pkg/rpm/{{.NAME}}.spec
    generates:
      - dist/{{.NAME}}-{{.VERSION}}-*.{{.ARCH}}.rpm
    preconditions:
      - sh: which rpmbuild
        msg: "Prerequisite utility 'rpmbuild' is not installed"
    cmds:
      - mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
      - cp ./pkg/rpm/{{.NAME}}.spec ~/rpmbuild/SPECS
      - cp dist/{{.NAME}}-{{.ARCH}}{{.SUFFIX}}.tar.gz ~/rpmbuild/SOURCES/{{.NAME}}.tar.gz
      - rpmbuild -bb --target {{.ARCH}} --define '_prefix /usr' ~/rpmbuild/SPECS/{{.NAME}}.spec
      - cp ~/rpmbuild/RPMS/{{.ARCH}}/{{.NAME}}-{{.VERSION}}-*.{{.ARCH}}.rpm dist

  dist:rpm:debug:
    desc: "Build a debug RPM (unoptimized + the debug feature) - much faster to iterate than rpm"
    aliases:
      - rpm:debug
    cmds:
      # Same NVR as the release RPM, so it installs straight over one. The binary is far larger
      # and slower; rebuild with `rpm` before measuring anything or shipping.
      - task: dist:rpm
        vars:
          PROFILE: debug

  dist:all:
    desc: Build all supported distributable packages
    aliases:
      - dist
    cmds:
      - task: dist:archive
      - task: dist:rpm

  version:set:
    desc: "Set the package version in Cargo.toml and the rpm spec - E.g. go-task version:set VERSION=1.2.3"
    requires:
      vars:
        - VERSION
    cmds:
      # Only replace the FIRST version match (the package version), not dependency versions
      - sed -i '0,/^version = "[0-9]\+\.[0-9]\+\.[0-9]\+"$/s//version = "{{.VERSION}}"/' Cargo.toml
      - "sed -i 's/^Version: .*/Version: {{.VERSION}}/' pkg/rpm/cosmic-comp.spec"
      # Sync the package's own entry in Cargo.lock (version line follows the name line).
      # Without this the release commit ships a stale lock, so the next local build rewrites it.
      - sed -i '/^name = "{{.NAME}}"$/{n;s/^version = .*/version = "{{.VERSION}}"/}' Cargo.lock

  release:build:
    desc: "Build the release RPMs for all arches (skipped when SKIP_BUILD=true; used by the release prepare step)"
    cmds:
      # SKIP_BUILD=true is set by the CI publish job, which reuses RPMs already
      # built by the parallel matrix jobs. Local/standalone runs build normally.
      - |
        if [ "${SKIP_BUILD:-}" != "true" ]; then
          task docker:run TARGET=dist:all ARCH=x86_64 TARGET_ARCH=x86_64-unknown-linux-gnu
          task docker:run TARGET=dist:all ARCH=aarch64 TARGET_ARCH=aarch64-unknown-linux-gnu
        fi

  release:
    desc: Publish a new release
    preconditions:
      - sh: which npx
        msg: "Prerequisite utility 'npx' is not installed"
    cmds:
      # The .releaserc.yaml config contains the build commands and publish config
      - npx semantic-release

  repo:update:
    desc: "Upload the release to the package repository"
    vars:
      BUCKET: playtron-dev2-global-os-public
      BUCKET_PATH: repos/playtron-app/{{.ARCH}}
      FILE: "dist/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm"
      REPO_NAME: playtron
    preconditions:
      - sh: ls {{.FILE}}
        msg: "File to upload does not exist: {{.FILE}}"
      - sh: env | grep -q '^PACKAGES_UPLOAD_TOKEN='
        msg: "PACKAGES_UPLOAD_TOKEN environment variable is not set"
    cmds:
      # TODO: Remove S3 uploads after repository switch
      - echo "Uploading {{.FILE}} to s3://{{.BUCKET}}/{{.BUCKET_PATH}}/$(basename {{.FILE}})"
      - aws s3 cp {{.FILE}} s3://{{.BUCKET}}/{{.BUCKET_PATH}}/$(basename "{{.FILE}}")
      - echo "Publishing {{.FILE}} to 'https://packages.playtron.one/rpm/{{.REPO_NAME}}/packages/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm'"
      - "curl -H 'Authorization: Bearer {{.PACKAGES_UPLOAD_TOKEN}}' -T {{.FILE}} 'https://packages.playtron.one/rpm/{{.REPO_NAME}}/packages/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm'"

  test:all:
    desc: Run all tests
    aliases:
      - test
    cmds:
      - cargo test -- --show-output

  test:one:
    desc: Run a single test - E.g. go-task test:one TEST=<test>
    requires:
      vars:
        - TEST
    cmds:
      - RUST_BACKTRACE=1 cargo test {{.TEST}} -- --exact --show-output --include-ignored

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf target .cache dist builder

  deploy:nix:
    desc: >-
      Deploy to a NixOS (Kora) host - build this checkout's RPM, then install it
      into the device's user profile. PROFILE=debug for a far quicker one.
      E.g. go-task deploy:nix HOST=ericky@192.168.1.220
    aliases:
      - deploy:nixos
    requires:
      vars:
        - name: HOST
    vars:
      GOTASK:
        sh: command -v go-task || command -v task
      # The device's own kora checkout - the one /etc/nixos's `kora` flake input
      # points at. kora builds cosmic-comp from source, so there is no
      # RPM `src` to swap and the template below builds its own derivation
      # around the one this checkout produces - see pkg/nix/dev-package.nix.in.
      KORA_DIR: '{{.KORA_DIR | default "~/dev/kora-nix-poc"}}'
      # device builds on {{.HOST}} itself, so it links against the glibc it will
      # run on. nix, container and host build here and are checked against it.
      BUILDER: '{{.BUILDER | default "device"}}'
      REMOTE_DIR: /tmp/{{.NAME}}-nix
      STAGE: .cache/nix
      # `debug` builds the repo's own debug feature - far faster to iterate
      # than a release compositor, and the same NVR, so it installs the same way.
      PROFILE: '{{.PROFILE | default "release"}}'
      # cosmic-comp is the session; restarting it ends the one on the device.
      RESTART: '{{.RESTART | default "false"}}'
    preconditions:
      - sh: which rsync
        msg: "Prerequisite utility 'rsync' is not installed"
      - sh: ssh -o BatchMode=yes -o ConnectTimeout=10 {{.HOST}} true
        msg: "Cannot reach {{.HOST}} over SSH without a password. Set up key auth first."
      - sh: ssh {{.HOST}} 'test -e /run/current-system'
        msg: "{{.HOST}} is not a NixOS host. Use `deploy:native` for RPM-based devices."
      - sh: ssh {{.HOST}} 'test -d {{.KORA_DIR}}'
        msg: >-
          No kora checkout at {{.KORA_DIR}} on {{.HOST}}. Point KORA_DIR at the one
          /etc/nixos's `kora` flake input uses.
      # Every builder packages in the dev shell this repo's flake describes.
      - sh: test -f flake.nix
        msg: "No flake.nix in this checkout, so there is no dev shell to build in."
      - sh: '[ "{{.BUILDER}}" != "device" ] || ssh {{.HOST}} "command -v nix git rsync >/dev/null"'
        msg: >-
          BUILDER=device builds on {{.HOST}}, which needs nix, git and rsync.
          Build here instead with BUILDER=nix or BUILDER=container.
      - sh: '[ "{{.BUILDER}}" != "nix" ] || command -v nix'
        msg: >-
          BUILDER=nix needs the 'nix' command on this machine. Drop it to build
          on {{.HOST}} instead, or use BUILDER=container.
    cmds:
      # PROFILE=debug is the same NVR, so it deploys by exactly this path - it is
      # unoptimized and much larger, so rebuild release before measuring anything.
      - task: deploy:nix:rpm
        vars:
          HOST: '{{.HOST}}'
          BUILDER: '{{.BUILDER}}'
          KORA_DIR: '{{.KORA_DIR}}'
          REMOTE_DIR: '{{.REMOTE_DIR}}'
          STAGE: '{{.STAGE}}'
          PROFILE: '{{.PROFILE}}'
          RPM_TARGET: '{{if eq .PROFILE "debug"}}dist:rpm:debug{{else}}dist:rpm{{end}}'
          SHELL_ATTR: '.#deploy'
      # `add` is `install` under its current name. A profile refuses a name it
      # already holds and there is no replace, so the previous deploy goes first;
      # removing one that was never installed is not worth stopping for.
      - |
        ssh {{.HOST}} 'nix profile remove {{.NAME}} >/dev/null 2>&1 || true
          nix profile add --impure --file {{.REMOTE_DIR}}/dev.nix {{.NAME}}'
      # Not killed by default: cosmic-comp *is* the session, so restarting it
      # logs the user out of {{.HOST}} with no warning. RESTART=true asks for it.
      - |
        case "{{.RESTART}}" in
          true|yes)
            echo "Restarting the compositor - this ends the session on {{.HOST}}."
            ssh {{.HOST}} 'pkill -x cosmic-comp || true' ;;
          *)
            echo "Not restarting. Log out and back in on {{.HOST}} to pick it up." ;;
        esac
      - |
        echo "Done. {{.NAME}} is in {{.HOST}}'s user profile."
        echo "cosmic-session resolves the compositor by name and ~/.nix-profile/bin"
        echo "outranks the system closure, so the next session starts this build."
        echo "Undo it with 'nix profile remove {{.NAME}}' on the device."

  deploy:nix:rpm:
    internal: true
    desc: >-
      Build the RPM and leave it, with the dev.nix wrapping it, in REMOTE_DIR on
      HOST - where every BUILDER finishes, so the install step need not care.
    vars:
      GOTASK:
        sh: command -v go-task || command -v task
      RPM_TARGET: '{{.RPM_TARGET | default "dist:rpm"}}'
      PROFILE: '{{.PROFILE | default "release"}}'
      SHELL_ATTR: '{{.SHELL_ATTR | default ""}}'
      # Home-relative, and its own directory: --delete into a tree you also work
      # in would discard uncommitted work. target/ survives between deploys.
      SRC_DIR: '{{.SRC_DIR | default (printf ".cache/kora-deploy/%s" .NAME)}}'
    cmds:
      - |
        set -e
        case "{{.BUILDER}}" in
        device)
          ssh {{.HOST}} 'mkdir -p {{.SRC_DIR}} {{.REMOTE_DIR}}'
          # .git goes too: nix reads a checkout through git, so .gitignore is what
          # keeps target/ out of the copy it takes into the store.
          rsync -a --delete \
            --exclude 'target/' --exclude '.cache/' --exclude 'dist/' --exclude 'result' \
            ./ {{.HOST}}:{{.SRC_DIR}}/
          # Quoted: what survives go-task's templating expands on the device.
          ssh {{.HOST}} bash -s <<'REMOTE'
        set -e
        cd {{.SRC_DIR}}
        # A flake's source is its tracked files; a new uncommitted one is not.
        git add -AN . >/dev/null 2>&1 || true
        nix develop {{.SHELL_ATTR}} --command task {{.RPM_TARGET}}
        rpm=$(ls dist/{{.NAME}}-{{.VERSION}}-*.rpm | tail -n1)
        cp "$rpm" {{.REMOTE_DIR}}/
        # getFlake takes no `~`, so resolve it rather than write it.
        sed -e "s|@KORA_DIR@|$(cd {{.KORA_DIR}} && pwd)|g" \
            -e "s|@SRC@|{{.REMOTE_DIR}}/$(basename "$rpm")|g" \
            -e "s|@NAME@|{{.NAME}}|g" \
            pkg/nix/dev-package.nix.in > {{.REMOTE_DIR}}/dev.nix
        REMOTE
          ;;
        nix|container|host)
          case "{{.BUILDER}}" in
            nix)
              nix develop {{.SHELL_ATTR}} --command task {{.RPM_TARGET}} ;;
            container)
              {{.GOTASK}} docker:run TARGET={{.RPM_TARGET}} ARCH={{.ARCH}} TARGET_ARCH={{.TARGET_ARCH}} ;;
            host)
              {{.GOTASK}} {{.RPM_TARGET}} ;;
          esac
          # ld.so rejects a too-new glibc symbol version at exec and no patching
          # fixes it. Only the builders that run here can get this wrong.
          bin=target/{{.TARGET_ARCH}}/{{.PROFILE}}/{{.NAME}}
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n1)
          have=GLIBC_$(ssh {{.HOST}} 'ldd --version | head -n1 | sed "s/.* //"')
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | tail -n1)" != "$have" ]; then
            echo "error: this build needs $need, {{.HOST}} provides $have. Wants:" >&2
            objdump -T "$bin" | grep -F "($need)" >&2
            echo "Drop BUILDER: the default builds on {{.HOST}} itself." >&2
            exit 1
          fi
          echo "glibc: this build needs $need, {{.HOST}} has $have"

          rm -rf {{.STAGE}}
          mkdir -p {{.STAGE}}
          rpm=$(ls dist/{{.NAME}}-{{.VERSION}}-*.{{.ARCH}}.rpm | tail -n1)
          cp "$rpm" {{.STAGE}}/
          kora=$(ssh {{.HOST}} 'cd {{.KORA_DIR}} && pwd')
          sed -e "s|@KORA_DIR@|$kora|g" \
              -e "s|@SRC@|{{.REMOTE_DIR}}/$(basename "$rpm")|g" \
              -e "s|@NAME@|{{.NAME}}|g" \
              pkg/nix/dev-package.nix.in > {{.STAGE}}/dev.nix
          ssh {{.HOST}} 'mkdir -p {{.REMOTE_DIR}}'
          # --delete so an older deploy's RPM does not sit there being confusing;
          # nix has already copied the one it used into the store.
          rsync -a --delete {{.STAGE}}/ {{.HOST}}:{{.REMOTE_DIR}}/
          ;;
        *)
          echo "error: unknown BUILDER '{{.BUILDER}}'; use device, nix, container or host" >&2
          exit 1 ;;
        esac

  nix:run:
    desc: Run a task in the native Nix development shell
    summary: |
      Run a task inside the shell `flake.nix` describes, without entering it:

        go-task nix:run TARGET=build:debug
        go-task nix:run TARGET=test:all

      Uses `.#deploy`, the shell `deploy:nix` packages in - `.#default` cannot
      resolve rust-toolchain.toml's 1.93 from the rust-overlay pin.
    aliases:
      - in-nix
    preconditions:
      - sh: which nix
        msg: "Prerequisite utility 'nix' is not installed"
    requires:
      vars:
        - TARGET
    cmds:
      # The inner `task` re-derives everything, where there is a compiler to ask.
      - nix develop .#deploy --command task {{.TARGET}}

  docker:build:
    desc: Build the container image used for the `docker:run` target
    preconditions:
      - sh: which docker
        msg: "Prerequisite utility 'docker' is not installed"
    status:
      - docker images | grep {{.IMAGE_NAME}} | grep {{.IMAGE_TAG}}
    cmds:
      - docker build -t {{.IMAGE_NAME}}:{{.IMAGE_TAG}} .

  docker:run:
    desc: Run tasks inside Docker. E.g. go-task docker:run TARGET=build TARGET_ARCH=x86_64-unknown-linux-gnu
    aliases:
      - in-docker
    deps:
      - docker:build
    preconditions:
      - sh: which docker
        msg: "Prerequisite utility 'docker' is not installed"
    vars:
      UID:
        sh: id -u
      GID:
        sh: id -g
      PWD:
        sh: pwd
      SSH_KEY:
        sh: echo "${SSH_KEY}"
      # Rootless podman maps --user onto a subuid that cannot read the mounted
      # checkout, and SELinux denies the labels. Real Docker needs neither.
      PODMAN_OPTS:
        sh: >-
          docker --version 2>/dev/null | grep -qi podman &&
          echo "--userns=keep-id --security-opt label=disable" || true
    requires:
      vars:
        - TARGET
    cmds:
      - mkdir -p .cache/home
      - mkdir -p .cache/var/lib/rpm
      # A /etc/passwd entry is required so the correct ~/.ssh path is used
      - echo -e "build:x:{{.UID}}:{{.GID}}::/home/build:/bin/bash" > .cache/passwd
      # Use the SSH key from the host
      - |
        mkdir -p .cache/.ssh
        {{ if ne .SSH_KEY "" }}
          echo "{{.SSH_KEY}}" > .cache/.ssh/id_ed25519
          chmod 600 .cache/.ssh/id_ed25519
        {{ else }}
          cp ~/.ssh/* .cache/.ssh
        {{ end }}
      - |
        docker run --rm {{.PODMAN_OPTS}} \
          -v "{{.PWD}}:{{.PWD}}" \
          -v "{{.PWD}}/../smithay:{{.PWD}}/../smithay" \
          -v "{{.PWD}}/.cache/home:/home/build" \
          -v "{{.PWD}}/.cache/var/lib/rpm:/var/lib/rpm" \
          -v "{{.PWD}}/.cache/.ssh:/home/build/.ssh" \
          -v "{{.PWD}}/.cache/passwd:/etc/passwd" \
          --workdir "{{.PWD}}" \
          -e HOME=/home/build \
          -e CARGO_HOME=/home/build/.cargo \
          -e BUILD_TYPE=${BUILD_TYPE} \
          -e PKG_CONFIG_SYSROOT_DIR="/usr/{{.ARCH}}-linux-gnu" \
          -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
          -e GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
          --user {{.UID}}:{{.GID}} \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} \
          task {{.TARGET}} ARCH={{.ARCH}} TARGET_ARCH={{.TARGET_ARCH}}
